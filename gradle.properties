# Gradle build performance settings — local dev only.
# Cuts subsequent ./gradlew run launches from 5-10 minutes down to 5-30 seconds.

# Keep the Gradle daemon alive between runs so we skip JVM startup + project
# configuration each time. Daemon dies after 3 hours idle by default.
org.gradle.daemon=true

# Build subprojects in parallel where dependencies allow.
org.gradle.parallel=true

# Cache compiled task outputs — repeated runs only re-do what changed.
org.gradle.caching=true

# Skip Gradle's own configuration phase on unchanged builds. Big win for
# small edit-build-run loops.
org.gradle.configureondemand=true

# Generous heap so the daemon doesn't churn the GC during long sessions.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
